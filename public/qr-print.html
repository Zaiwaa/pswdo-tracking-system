<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print Document QR</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f3f6fa;color:#10223e}.wrap{max-width:560px;margin:32px auto;padding:16px}.label{background:#fff;border:2px solid #173f76;border-radius:18px;padding:26px;text-align:center}.org{font-weight:800;letter-spacing:.08em}.qr{width:min(330px,85vw);height:auto;margin:18px auto;display:block}.ref{font-size:22px;font-weight:900;overflow-wrap:anywhere}.desc{margin-top:8px;font-size:14px}.hint{margin-top:14px;font-weight:700}.url{font-size:10px;color:#53667d;overflow-wrap:anywhere;margin-top:10px}.actions{text-align:center;margin-top:16px}.actions button{border:0;border-radius:10px;padding:11px 16px;font-weight:800;background:#173f76;color:#fff;cursor:pointer}@media print{body{background:#fff}.wrap{margin:0;padding:0}.actions{display:none}.label{box-shadow:none;page-break-inside:avoid}}</style></head><body><div class="wrap"><div class="label"><div class="org">PSWDO DOCUMENT TRACKING</div><img id="qr" class="qr" alt="Document QR code"><div class="ref" id="ref">Loading…</div><div class="desc" id="desc"></div><div class="hint">Scan to view the latest document status</div><div class="url" id="url"></div></div><div class="actions"><button onclick="window.print()">Print QR Label</button></div></div><script>const token=location.pathname.split('/').filter(Boolean).pop();fetch('/api/public/track/'+encodeURIComponent(token)+'/label').then(r=>r.json().then(j=>{if(!r.ok)throw new Error(j.error||'Unable to load');return j})).then(j=>{document.getElementById('qr').src='/api/public/track/'+encodeURIComponent(token)+'/qr.png';document.getElementById('ref').textContent=j.referenceNumber;document.getElementById('desc').textContent=j.description||'';document.getElementById('url').textContent=j.trackingUrl;document.title='QR - '+j.referenceNumber}).catch(e=>document.getElementById('ref').textContent=e.message)</script></body></html>
