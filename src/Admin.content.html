<style>
.admin-shell{display:flex;flex-direction:column;gap:18px}.admin-head,.admin-card{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:20px;box-shadow:0 18px 45px rgba(15,23,42,.09)}
.admin-head h1{margin:0;color:#14213d}.admin-head p{margin:6px 0 0;color:#64748b}.admin-table-wrap{overflow:auto}.admin-table{width:100%;border-collapse:collapse;min-width:920px}.admin-table th,.admin-table td{padding:11px 10px;border-bottom:1px solid #e8edf4;text-align:left;font-size:12px;vertical-align:middle}.admin-table th{color:#475569;font-size:11px;text-transform:uppercase;letter-spacing:.04em}.admin-table select,.admin-table input{height:36px;border:1px solid #d7dee8;border-radius:9px;padding:0 9px}.admin-table button{height:36px;border:0;border-radius:9px;padding:0 10px;background:#173f76;color:white;cursor:pointer}.status-pill{padding:5px 9px;border-radius:999px;background:#eef2f7;font-weight:700}.admin-message{font-size:13px;color:#475569;margin:0 0 12px}
</style>
<div class="admin-shell">
  <section class="admin-head"><h1>User Administration</h1><p>Approve accounts, disable access, assign roles, and reset passwords.</p></section>
  <section class="admin-card"><p class="admin-message" id="adminMsg"></p><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Position</th><th>Status</th><th>Role</th><th>Password reset</th><th>Last login</th></tr></thead><tbody id="adminUsersBody"><tr><td colspan="7">Loading…</td></tr></tbody></table></div></section>
</div>
<script>
(function(){
 const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function msg(t){document.getElementById('adminMsg').textContent=t||''}
 function load(){google.script.run.withSuccessHandler(rows=>{document.getElementById('adminUsersBody').innerHTML=rows.map(u=>`<tr><td><b>${esc(u.fullName)}</b></td><td>${esc(u.email)}</td><td>${esc(u.position)}</td><td><select data-status="${esc(u.id)}"><option ${u.status==='Pending'?'selected':''}>Pending</option><option ${u.status==='Active'?'selected':''}>Active</option><option ${u.status==='Disabled'?'selected':''}>Disabled</option></select></td><td><select data-role="${esc(u.id)}"><option ${u.role==='User'?'selected':''}>User</option><option ${u.role==='Administrator'?'selected':''}>Administrator</option></select></td><td><input type="password" placeholder="Temporary password" data-pass="${esc(u.id)}"><button data-reset="${esc(u.id)}">Reset</button></td><td>${esc(u.lastLogin||'Never')}</td></tr>`).join(''); bind();}).withFailureHandler(e=>{msg(e.message||e);document.getElementById('adminUsersBody').innerHTML='<tr><td colspan="7">Administrator access required.</td></tr>'}).adminListUsers()}
 function bind(){document.querySelectorAll('[data-status]').forEach(x=>x.onchange=()=>google.script.run.withSuccessHandler(()=>{msg('Account status updated.');load()}).withFailureHandler(e=>{msg(e.message||e);load()}).adminSetUserStatus(x.dataset.status,x.value));document.querySelectorAll('[data-role]').forEach(x=>x.onchange=()=>google.script.run.withSuccessHandler(()=>{msg('Role updated.');load()}).withFailureHandler(e=>{msg(e.message||e);load()}).adminSetUserRole(x.dataset.role,x.value));document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{const i=document.querySelector(`[data-pass="${b.dataset.reset}"]`);if(!i.value)return msg('Enter a temporary password first.');google.script.run.withSuccessHandler(()=>{msg('Password reset. Give the temporary password to the user securely.');i.value=''}).withFailureHandler(e=>msg(e.message||e)).adminResetPassword(b.dataset.reset,i.value)})}
 document.addEventListener('DOMContentLoaded',load);
})();
</script>
