<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PSWDO - Document Tracking System</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root{
      --page-bg-1:#dbeafe;
      --page-bg-2:#f8fafc;
      --navy-1:rgba(10,31,68,.92);
      --navy-2:rgba(20,50,92,.88);
      --navy-3:rgba(33,70,122,.82);
      --glass:rgba(255,255,255,.12);
      --glass-strong:rgba(255,255,255,.18);
      --glass-border:rgba(255,255,255,.22);
      --glass-shadow:0 12px 30px rgba(2,12,27,.24);
      --content-glass:rgba(255,255,255,.34);
      --content-border:rgba(255,255,255,.48);
      --text-light:#f8fbff;
      --text-muted:#bfd0e3;
    }

    *{margin:0;padding:0;box-sizing:border-box}

    html,body{
      width:100%;
      min-height:100%;
      overflow-x:hidden;
    }

    body{
      font-family:'Poppins',sans-serif;
      color:#1f2937;
      min-height:100vh;
      background:
        radial-gradient(circle at top left,rgba(255,255,255,.88),transparent 30%),
        radial-gradient(circle at bottom right,rgba(147,197,253,.42),transparent 28%),
        linear-gradient(135deg,var(--page-bg-1),var(--page-bg-2));
    }

    .app-shell{min-height:100vh;width:100%}

    /* NAVY GLASS SIDEBAR */
    .sidebar{
      position:fixed;
      top:16px;
      left:16px;
      width:270px;
      height:calc(100vh - 32px);
      padding:16px;
      color:var(--text-light);
      z-index:1200;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      border-radius:24px;
      border:1px solid var(--glass-border);
      background:
        linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03)),
        linear-gradient(160deg,var(--navy-1),var(--navy-2) 58%,var(--navy-3));
      backdrop-filter:blur(18px) saturate(135%);
      -webkit-backdrop-filter:blur(18px) saturate(135%);
      box-shadow:var(--glass-shadow);
      transition:transform .25s ease,opacity .25s ease;
    }

    .sidebar::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      border-radius:inherit;
      background:linear-gradient(135deg,rgba(255,255,255,.10),transparent 34%);
    }

    .sidebar-top{
      position:relative;
      z-index:1;
      flex:1 1 auto;
      min-height:0;
      overflow-y:auto;
      overflow-x:hidden;
      padding-right:3px;
    }

    .sidebar-top::-webkit-scrollbar{width:5px}
    .sidebar-top::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.24);
      border-radius:999px;
    }

    .app-title{
      display:flex;
      align-items:center;
      gap:11px;
      padding:13px;
      margin-bottom:14px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.08);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
    }

    .app-logo{
      width:40px;
      height:40px;
      object-fit:contain;
      flex-shrink:0;
      border-radius:11px;
      padding:4px;
      background:rgba(255,255,255,.14);
    }

    .app-title-text{min-width:0;line-height:1.2}
    .app-title-text small{
      display:block;
      margin-bottom:2px;
      font-size:10px;
      font-weight:600;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--text-muted);
    }
    .app-title-text span{
      display:block;
      color:#fff;
      font-family:'Montserrat',sans-serif;
      font-size:14px;
      font-weight:700;
    }

    .nav-section-label{
      margin:12px 0 8px 12px;
      color:#b8cbe0;
      font-size:10px;
      line-height:1;
      font-weight:600;
      letter-spacing:.11em;
      text-transform:uppercase;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:9px;
    }

    .nav-item{
      position:relative;
      display:flex;
      align-items:center;
      gap:12px;
      min-height:52px;
      padding:12px 15px;
      border-radius:16px;
      color:#f8fbff;
      text-decoration:none;
      font-size:14px;
      font-weight:600;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 8px 20px rgba(1,10,24,.14);
      transition:transform .2s ease,background .2s ease,border-color .2s ease;
    }

    .nav-item i{
      width:20px;
      min-width:20px;
      text-align:center;
      font-size:16px;
      color:#eaf3ff;
    }

    .nav-item:hover{
      transform:translateX(3px);
      background:rgba(255,255,255,.14);
      border-color:rgba(255,255,255,.24);
    }

    .nav-item.active{
      background:rgba(255,255,255,.18);
      border-color:rgba(255,255,255,.30);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        0 10px 24px rgba(1,10,24,.22);
    }

    .nav-item.active::before{
      content:"";
      position:absolute;
      left:-1px;
      top:7px;
      bottom:7px;
      width:4px;
      border-radius:0 8px 8px 0;
      background:#fff;
      box-shadow:0 0 12px rgba(255,255,255,.55);
    }

    .nav-label{line-height:1.35;white-space:normal}

    .sidebar-footer{
      position:relative;
      z-index:1;
      flex-shrink:0;
      margin-top:14px;
      padding:13px 15px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    .sidebar-footer small{
      display:block;
      margin-bottom:4px;
      color:#bfd0e3;
      font-size:10px;
      font-weight:600;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .sidebar-footer strong{color:#fff;font-size:14px;font-weight:600}

    /* WHOLE DOCUMENT AREA AS GLASS */
    .main-content{
      margin-left:302px;
      padding:16px 16px 16px 0;
      min-width:0;
    }

    .content{
      position:relative;
      min-width:0;
      min-height:calc(100vh - 32px);
      padding:24px;
      border-radius:28px;
      overflow:visible;
      border:1px solid var(--content-border);
      background:
        linear-gradient(135deg,rgba(255,255,255,.54),rgba(255,255,255,.26));
      backdrop-filter:blur(18px) saturate(125%);
      -webkit-backdrop-filter:blur(18px) saturate(125%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.60),
        0 16px 40px rgba(15,23,42,.12);
    }

    .content::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      pointer-events:none;
      background:linear-gradient(135deg,rgba(255,255,255,.16),transparent 36%);
    }

    .content > *{position:relative;z-index:1}

    .mobile-menu-btn{
      display:none;
      position:fixed;
      top:12px;
      left:12px;
      width:44px;
      height:44px;
      border:none;
      border-radius:13px;
      color:#fff;
      z-index:1400;
      cursor:pointer;
      align-items:center;
      justify-content:center;
      font-size:18px;
      background:rgba(10,31,68,.90);
      border:1px solid rgba(255,255,255,.20);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      box-shadow:0 8px 22px rgba(15,23,42,.24);
    }

    .sidebar-backdrop{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(2,12,27,.46);
      backdrop-filter:blur(3px);
      -webkit-backdrop-filter:blur(3px);
      z-index:1100;
    }

    @media(max-width:1024px){
      .sidebar{width:242px}
      .main-content{margin-left:274px}
    }

    @media(max-width:768px){
      .mobile-menu-btn{display:inline-flex}
      .sidebar{
        top:0;
        left:0;
        width:274px;
        height:100vh;
        border-radius:0 24px 24px 0;
        transform:translateX(-100%);
        opacity:0;
      }
      .sidebar.show{transform:translateX(0);opacity:1}
      .sidebar-backdrop.show{display:block}
      .main-content{margin-left:0;padding:10px}
      .content{min-height:calc(100vh - 20px);padding:14px;border-radius:22px}
    }

    @media(max-width:480px){.sidebar{width:256px}}


    /* AUTH + COLLABORATION */
    .auth-gate{position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0b1f44,#173f76 58%,#e8f1fb)}
    .auth-card{width:min(460px,100%);padding:26px;border-radius:24px;background:rgba(255,255,255,.94);box-shadow:0 30px 80px rgba(2,12,27,.32)}
    .auth-card h2{font-family:'Montserrat',sans-serif;margin:0 0 6px;color:#0f2747}.auth-card p{color:#64748b;font-size:13px;margin:0 0 18px}
    .auth-tabs{display:flex;gap:8px;margin-bottom:16px}.auth-tab{flex:1;border:0;border-radius:12px;padding:11px;font-weight:700;cursor:pointer}.auth-tab.active{background:#173f76;color:#fff}
    .auth-field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.auth-field label{font-size:12px;font-weight:700;color:#334155}.auth-field input{height:45px;border:1px solid #d7dee8;border-radius:12px;padding:0 13px;font-family:inherit}
    .auth-submit{width:100%;height:46px;border:0;border-radius:12px;background:#173f76;color:#fff;font-weight:700;cursor:pointer}.auth-error{min-height:18px;color:#b91c1c;font-size:12px;margin:8px 0}.hidden{display:none!important}
    .collab-actions{position:fixed;top:18px;right:18px;z-index:1300;display:flex;gap:9px}.collab-btn{position:relative;width:44px;height:44px;border:1px solid rgba(255,255,255,.5);border-radius:14px;background:rgba(255,255,255,.8);box-shadow:0 8px 24px rgba(15,23,42,.12);cursor:pointer;color:#173f76}.notif-badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#dc2626;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
    .collab-panel{position:fixed;top:72px;right:18px;z-index:2200;width:min(390px,calc(100vw - 24px));max-height:72vh;border-radius:20px;background:#fff;box-shadow:0 24px 70px rgba(15,23,42,.25);border:1px solid #e5e7eb;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid #eef2f7}.panel-head h3{margin:0;font-size:16px}.panel-body{padding:12px;max-height:55vh;overflow:auto}.close-panel{border:0;background:transparent;font-size:18px;cursor:pointer}.chat-list{display:flex;flex-direction:column;gap:10px}.chat-item{padding:10px 12px;border-radius:14px;background:#f5f7fb}.chat-item.me{background:#e8f1ff}.chat-meta{font-size:11px;color:#64748b;margin-bottom:3px}.chat-text{font-size:13px;white-space:pre-wrap;word-break:break-word}.chat-compose{display:flex;gap:8px;padding:12px;border-top:1px solid #eef2f7}.chat-compose input{flex:1;height:42px;border:1px solid #d7dee8;border-radius:12px;padding:0 12px}.chat-compose button{border:0;border-radius:12px;padding:0 14px;background:#173f76;color:#fff;font-weight:700}.notif-item{padding:11px;border-bottom:1px solid #eef2f7;cursor:pointer}.notif-item.unread{background:#f0f6ff}.notif-title{font-weight:700;font-size:13px}.notif-msg,.notif-time{font-size:12px;color:#64748b}.profile-line{display:block;color:#bfd0e3;font-size:11px;margin-top:2px}

  </style>
</head>

<body>

  <div class="auth-gate" id="authGate">
    <div class="auth-card">
      <h2>PSWDO Tracking System</h2><p>Sign in to continue, or create an account.</p>
      <div class="auth-tabs"><button class="auth-tab active" id="loginTab">Log In</button><button class="auth-tab" id="registerTab">Create Account</button></div>
      <div id="loginForm">
        <div class="auth-field"><label>Email</label><input id="loginEmail" type="email" autocomplete="email"></div>
        <div class="auth-field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
        <div class="auth-error" id="loginError"></div><button class="auth-submit" id="loginBtn">Log In</button>
      </div>
      <div id="registerForm" class="hidden">
        <div class="auth-field"><label>Full Name</label><input id="regName"></div>
        <div class="auth-field"><label>Email</label><input id="regEmail" type="email"></div>
        <div class="auth-field"><label>Position / Designation</label><input id="regPosition" placeholder="e.g. Administrative Assistant II"></div>
        <div class="auth-field"><label>Password</label><input id="regPassword" type="password" minlength="8"></div>
        <div class="auth-error" id="registerError"></div><button class="auth-submit" id="registerBtn">Create Account</button>
      </div>
    </div>
  </div>

  <div class="collab-actions hidden" id="collabActions">
    <button class="collab-btn" id="chatBtn" title="Team Chat"><i class="fas fa-comments"></i></button>
    <button class="collab-btn" id="notifBtn" title="Notifications"><i class="fas fa-bell"></i><span class="notif-badge hidden" id="notifBadge">0</span></button>
  </div>
  <section class="collab-panel hidden" id="chatPanel"><div class="panel-head"><h3>Team Chat</h3><button class="close-panel" data-close="chatPanel">×</button></div><div class="panel-body chat-list" id="chatList"></div><div class="chat-compose"><input id="chatInput" maxlength="1000" placeholder="Type a message..."><button id="sendChatBtn">Send</button></div></section>
  <section class="collab-panel hidden" id="notifPanel"><div class="panel-head"><h3>Notifications</h3><div><button class="close-panel" id="readAllBtn" title="Mark all read"><i class="fas fa-check-double"></i></button><button class="close-panel" data-close="notifPanel">×</button></div></div><div class="panel-body" id="notifList"></div></section>

  <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Open menu">
    <i class="fas fa-bars"></i>
  </button>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="app-title">
          <img src="https://www.pangasinan.gov.ph/wp-content/uploads/elementor/thumbs/PSWDO-qhqvwgb4xfjcr3z7j4i7vckl9tcvd88r214f8b6gdg.png" alt="PSWDO Logo" class="app-logo">
          <div class="app-title-text">
            <small>PSWDO</small>
            <span>Document Tracking System</span>
          </div>
        </div>

        <div class="nav-section-label">Main</div>

        <nav class="nav">
          <a href="<?= getScriptUrl() ?>?page=dashboard" class="nav-item <?= currentPage === 'dashboard' ? 'active' : '' ?>">
            <i class="fas fa-gauge-high"></i>
            <span class="nav-label">Dashboard</span>
          </a>

          <a href="<?= getScriptUrl() ?>?page=documents" class="nav-item <?= currentPage === 'documents' ? 'active' : '' ?>">
            <i class="fas fa-folder-open"></i>
            <span class="nav-label">Document Tracking</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <small>Logged in as</small>
        <strong id="currentUserName">User</strong><span class="profile-line" id="currentUserPosition"></span><button id="logoutBtn" style="margin-top:8px;border:0;border-radius:9px;padding:7px 10px;cursor:pointer">Log out</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="content">
        <?!= include(contentTemplate) ?>
      </div>
    </main>
  </div>

  <script>
    (function(){
      const menuBtn=document.getElementById('mobileMenuBtn');
      const sidebar=document.getElementById('sidebar');
      const backdrop=document.getElementById('sidebarBackdrop');

      function openSidebar(){
        sidebar.classList.add('show');
        backdrop.classList.add('show');
      }

      function closeSidebar(){
        sidebar.classList.remove('show');
        backdrop.classList.remove('show');
      }

      menuBtn.addEventListener('click',function(){
        sidebar.classList.contains('show') ? closeSidebar() : openSidebar();
      });

      backdrop.addEventListener('click',closeSidebar);

      window.addEventListener('resize',function(){
        if(window.innerWidth>768) closeSidebar();
      });
    })();
  </script>

  <script>
  (function(){
    const tokenKey='pswdo_tracking_session'; let currentUser=null;
    const $=id=>document.getElementById(id); const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function token(){return localStorage.getItem(tokenKey)||''} function showGate(){ $('authGate').classList.remove('hidden'); $('collabActions').classList.add('hidden'); }
    function enter(user){currentUser=user;$('authGate').classList.add('hidden');$('collabActions').classList.remove('hidden');$('currentUserName').textContent=user.fullName;$('currentUserPosition').textContent=user.position||'';loadNotifications();}
    function fail(id,e){$(id).textContent=e&&e.message?e.message:String(e||'Something went wrong.');}
    function checkSession(){const t=token();if(!t)return showGate();google.script.run.withSuccessHandler(u=>u?enter(u):(localStorage.removeItem(tokenKey),showGate())).withFailureHandler(()=>showGate()).authCurrentUser(t)}
    function setTab(which){const login=which==='login';$('loginTab').classList.toggle('active',login);$('registerTab').classList.toggle('active',!login);$('loginForm').classList.toggle('hidden',!login);$('registerForm').classList.toggle('hidden',login)}
    $('loginTab').onclick=()=>setTab('login');$('registerTab').onclick=()=>setTab('register');
    $('loginBtn').onclick=()=>{ $('loginError').textContent=''; google.script.run.withSuccessHandler(r=>{localStorage.setItem(tokenKey,r.token);enter(r.user)}).withFailureHandler(e=>fail('loginError',e)).authLogin($('loginEmail').value,$('loginPassword').value)};
    $('registerBtn').onclick=()=>{ $('registerError').textContent=''; google.script.run.withSuccessHandler(r=>{setTab('login');$('loginEmail').value=$('regEmail').value;$('loginError').textContent=r.message}).withFailureHandler(e=>fail('registerError',e)).authRegister({fullName:$('regName').value,email:$('regEmail').value,position:$('regPosition').value,password:$('regPassword').value})};
    $('logoutBtn').onclick=()=>{const t=token();localStorage.removeItem(tokenKey);google.script.run.authLogout(t);showGate()};
    document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.add('hidden'));
    $('chatBtn').onclick=()=>{$('notifPanel').classList.add('hidden');$('chatPanel').classList.toggle('hidden');if(!$('chatPanel').classList.contains('hidden'))loadChat()};
    $('notifBtn').onclick=()=>{$('chatPanel').classList.add('hidden');$('notifPanel').classList.toggle('hidden');if(!$('notifPanel').classList.contains('hidden'))loadNotifications()};
    function loadChat(){if(!token())return;google.script.run.withSuccessHandler(rows=>{$('chatList').innerHTML=rows.map(m=>`<div class="chat-item ${currentUser&&m.userId===currentUser.id?'me':''}"><div class="chat-meta"><b>${esc(m.fullName)}</b> · ${esc(m.position)} · ${esc(m.createdAt)}</div><div class="chat-text">${esc(m.message)}</div></div>`).join('')||'<div class="chat-meta">No messages yet.</div>';$('chatList').scrollTop=$('chatList').scrollHeight}).collabGetMessages(token(),60)}
    function sendChat(){const v=$('chatInput').value.trim();if(!v)return;google.script.run.withSuccessHandler(()=>{$('chatInput').value='';loadChat();loadNotifications()}).withFailureHandler(e=>alert(e.message||e)).collabSendMessage(token(),v)}
    $('sendChatBtn').onclick=sendChat;$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});
    function loadNotifications(){if(!token())return;google.script.run.withSuccessHandler(rows=>{const unread=rows.filter(n=>!n.read).length;$('notifBadge').textContent=unread;$('notifBadge').classList.toggle('hidden',!unread);$('notifList').innerHTML=rows.map(n=>`<div class="notif-item ${n.read?'':'unread'}" data-nid="${esc(n.id)}"><div class="notif-title">${esc(n.title)}</div><div class="notif-msg">${esc(n.message)}</div><div class="notif-time">${esc(n.createdAt)}</div></div>`).join('')||'<div class="notif-msg">No notifications.</div>';document.querySelectorAll('[data-nid]').forEach(el=>el.onclick=()=>google.script.run.withSuccessHandler(loadNotifications).collabMarkNotificationRead(token(),el.dataset.nid))}).withFailureHandler(()=>{}).collabGetNotifications(token())}
    $('readAllBtn').onclick=()=>google.script.run.withSuccessHandler(loadNotifications).collabMarkAllNotificationsRead(token());
    setInterval(()=>{if(token()){loadNotifications();if(!$('chatPanel').classList.contains('hidden'))loadChat()}},10000);
    checkSession();
  })();
  </script>

</body>
</html>
