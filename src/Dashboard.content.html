<style>
:root{
  --dash-text:#172033;
  --dash-muted:#6c7890;

  --navy-1:rgba(7,26,54,.96);
  --navy-2:rgba(18,58,107,.90);
  --navy-3:rgba(43,108,176,.80);

  --glass:rgba(255,255,255,.26);
  --glass-strong:rgba(255,255,255,.42);
  --glass-border:rgba(255,255,255,.58);

  --soft-blue:#eaf2fb;
  --soft-blue-text:#55779f;

  --soft-amber:#faf3e6;
  --soft-amber-text:#9a773c;

  --soft-green:#eaf6ef;
  --soft-green-text:#4e8a68;

  --soft-red:#f8ecec;
  --soft-red-text:#a15d5d;

  --shadow-lg:
    0 26px 60px rgba(15,23,42,.14),
    inset 0 1px 0 rgba(255,255,255,.66);

  --shadow-md:
    0 14px 34px rgba(15,23,42,.10),
    inset 0 1px 0 rgba(255,255,255,.54);
}

*{
  box-sizing:border-box;
}

.dashboard-shell{
  position:relative;
  isolation:isolate;
  display:flex;
  flex-direction:column;
  gap:20px;
  min-width:0;
}

.dashboard-shell::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  background:
    radial-gradient(circle at 10% 8%,rgba(255,255,255,.54),transparent 28%),
    radial-gradient(circle at 90% 12%,rgba(96,165,250,.18),transparent 28%),
    radial-gradient(circle at 72% 90%,rgba(56,189,248,.10),transparent 34%);
}

/* HERO */
.dashboard-hero{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:24px;
  border-radius:26px;

  background:
    linear-gradient(145deg,rgba(255,255,255,.44),rgba(255,255,255,.16));

  border:1px solid var(--glass-border);

  backdrop-filter:blur(24px) saturate(145%);
  -webkit-backdrop-filter:blur(24px) saturate(145%);

  box-shadow:var(--shadow-lg);
}

.dashboard-hero h1{
  margin:0;
  color:#101a31;
  font-size:32px;
  line-height:1.08;
  letter-spacing:-.035em;
  font-weight:750;
}

.dashboard-hero p{
  margin:7px 0 0;
  color:var(--dash-muted);
  font-size:14px;
}

.live-badge{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:10px 14px;
  border-radius:999px;

  background:rgba(255,255,255,.34);
  border:1px solid rgba(255,255,255,.62);

  color:#38516d;
  font-size:12px;
  font-weight:650;
  white-space:nowrap;

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

.live-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#63b082;
  box-shadow:0 0 0 5px rgba(99,176,130,.12);
}

/* STATS */
.dashboard-stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(220px,1fr));
  gap:18px;
  min-width:0;
}

.stat-card{
  position:relative;
  overflow:hidden;
  min-width:0;
  min-height:168px;
  padding:20px;
  border-radius:22px;

  background:
    linear-gradient(145deg,rgba(255,255,255,.44),rgba(255,255,255,.18));

  border:1px solid var(--glass-border);

  backdrop-filter:blur(24px) saturate(145%);
  -webkit-backdrop-filter:blur(24px) saturate(145%);

  box-shadow:var(--shadow-lg);

  transition:
    transform .22s ease,
    box-shadow .22s ease,
    border-color .22s ease;
}

.stat-card::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(120deg,rgba(255,255,255,.34),transparent 36%),
    radial-gradient(circle at 92% 10%,var(--accent-glow),transparent 34%);
}

.stat-card.docs{
  --accent-glow:rgba(83,126,177,.16);
}

.stat-card.pending{
  --accent-glow:rgba(190,145,67,.16);
}

.stat-card.approved{
  --accent-glow:rgba(78,138,104,.16);
}

.stat-card.clickable{
  cursor:pointer;
}

.stat-card.clickable:hover{
  transform:translateY(-4px);
  border-color:rgba(255,255,255,.76);
  box-shadow:
    0 32px 72px rgba(15,23,42,.16),
    inset 0 1px 0 rgba(255,255,255,.74);
}

.stat-card.active-filter{
  outline:2px solid rgba(59,130,246,.20);
  box-shadow:
    0 30px 68px rgba(15,23,42,.16),
    0 0 0 5px rgba(59,130,246,.08),
    inset 0 1px 0 rgba(255,255,255,.74);
}

.stat-content{
  position:relative;
  z-index:1;
}

.stat-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}

.stat-icon{
  width:44px;
  height:44px;
  border-radius:14px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  font-size:17px;

  border:1px solid rgba(255,255,255,.58);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.66),
    0 8px 18px rgba(15,23,42,.06);
}

.stat-chip{
  padding:6px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  border:1px solid rgba(255,255,255,.58);
  white-space:nowrap;
}

.docs .stat-icon,
.docs .stat-chip{
  background:var(--soft-blue);
  color:var(--soft-blue-text);
}

.pending .stat-icon,
.pending .stat-chip{
  background:var(--soft-amber);
  color:var(--soft-amber-text);
}

.approved .stat-icon,
.approved .stat-chip{
  background:var(--soft-green);
  color:var(--soft-green-text);
}

.stat-label{
  margin-top:18px;
  color:#435069;
  font-size:13px;
  font-weight:650;
}

.stat-value{
  margin-top:5px;
  color:#101827;
  font-size:44px;
  line-height:1;
  letter-spacing:-.045em;
  font-weight:800;
}

.stat-subtext{
  margin-top:12px;
  color:var(--dash-muted);
  font-size:12px;
}

/* ACTIVITY CARD */
.activity-card{
  padding:22px;
  border-radius:26px;

  background:
    linear-gradient(145deg,rgba(255,255,255,.42),rgba(255,255,255,.16));

  border:1px solid var(--glass-border);

  backdrop-filter:blur(26px) saturate(145%);
  -webkit-backdrop-filter:blur(26px) saturate(145%);

  box-shadow:var(--shadow-lg);

  min-width:0;
}

.activity-card-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
}

.activity-heading{
  display:flex;
  align-items:center;
  gap:12px;
}

.activity-icon{
  width:42px;
  height:42px;
  border-radius:14px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  color:#4f7198;
  background:rgba(234,242,251,.86);

  border:1px solid rgba(255,255,255,.62);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.70),
    0 8px 18px rgba(15,23,42,.06);
}

.activity-card h3{
  margin:0;
  color:#101a31;
  font-size:21px;
  line-height:1.2;
  font-weight:750;
  letter-spacing:-.02em;
}

.activity-subtitle{
  margin-top:4px;
  color:var(--dash-muted);
  font-size:12px;
}

.activity-controls{
  display:flex;
  align-items:center;
  gap:10px;
}

.activity-search{
  position:relative;
  width:min(310px,100%);
}

.activity-search i{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#8390a5;
  font-size:13px;
  pointer-events:none;
}

.activity-search input{
  width:100%;
  height:42px;
  padding:0 14px 0 38px;

  border-radius:14px;
  border:1px solid rgba(255,255,255,.62);

  background:rgba(255,255,255,.34);
  color:#26334a;

  outline:none;
  font-family:'Poppins',sans-serif;

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

.activity-search input:focus{
  border-color:rgba(59,130,246,.34);
  box-shadow:0 0 0 4px rgba(37,99,235,.08);
}

/* TABLE */
.activity-table-wrap{
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;

  border-radius:18px;
  border:1px solid rgba(255,255,255,.50);

  background:rgba(255,255,255,.14);

  box-shadow:
    0 14px 32px rgba(15,23,42,.07),
    inset 0 1px 0 rgba(255,255,255,.50);
}

.activity-table{
  width:100%;
  min-width:1100px;

  border-collapse:separate;
  border-spacing:0;
}

.activity-table thead{
  background:
    linear-gradient(
      135deg,
      var(--navy-1),
      var(--navy-2) 58%,
      var(--navy-3)
    );
}

.activity-table thead th{
  padding:15px 16px;

  text-align:left;

  color:#f7fbff;

  font-size:12px;
  font-weight:650;
  letter-spacing:.015em;

  white-space:nowrap;

  border-right:1px solid rgba(255,255,255,.06);
  border-bottom:1px solid rgba(255,255,255,.18);

  text-shadow:0 1px 2px rgba(0,0,0,.18);
}

.activity-table thead th:first-child{
  border-top-left-radius:16px;
}

.activity-table thead th:last-child{
  border-top-right-radius:16px;
  border-right:none;
}

.activity-table tbody tr{
  background:rgba(255,255,255,.12);

  transition:
    background .18s ease,
    box-shadow .18s ease;
}

.activity-table tbody tr:nth-child(even){
  background:rgba(255,255,255,.07);
}

.activity-table tbody tr:hover{
  background:rgba(255,255,255,.26);
  box-shadow:inset 4px 0 0 rgba(79,113,152,.45);
}

.activity-table tbody td{
  padding:14px 16px;

  vertical-align:top;

  color:#26334a;

  font-size:13px;
  line-height:1.42;

  border-top:1px solid rgba(148,163,184,.13);

  background:transparent;

  word-break:break-word;
}

/* CHIPS */
.chip{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;

  padding:6px 10px;

  border-radius:999px;

  font-size:11px;
  font-weight:700;

  white-space:nowrap;

  border:1px solid transparent;
}

.chip::before{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:currentColor;
  opacity:.7;
}

.chip-blue{
  background:var(--soft-blue);
  color:var(--soft-blue-text);
  border-color:#d7e3ef;
}

.chip-pending{
  background:var(--soft-amber);
  color:var(--soft-amber-text);
  border-color:#eadfc8;
}

.chip-approved{
  background:var(--soft-green);
  color:var(--soft-green-text);
  border-color:#d6eadf;
}

.chip-rts{
  background:var(--soft-red);
  color:var(--soft-red-text);
  border-color:#ead3d3;
}

.program-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-width:64px;

  padding:6px 10px;

  border-radius:999px;

  background:rgba(238,244,251,.88);
  border:1px solid #d9e4ef;

  color:#5b7695;

  font-size:11px;
  font-weight:700;

  white-space:nowrap;
}

.empty-state,
.loading-state{
  padding:30px;
  text-align:center;
  color:var(--dash-muted);
  font-size:13px;
}

/* MOBILE CARDS */
.activity-mobile-list{
  display:none;
  flex-direction:column;
  gap:12px;
}

.activity-mobile-item{
  padding:15px;
  border-radius:18px;

  background:
    linear-gradient(145deg,rgba(255,255,255,.44),rgba(255,255,255,.18));

  border:1px solid rgba(255,255,255,.56);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  box-shadow:var(--shadow-md);
}

.activity-mobile-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:12px;
}

.activity-mobile-ref{
  color:#162238;
  font-size:13px;
  line-height:1.35;
  font-weight:750;
  word-break:break-word;
}

.activity-mobile-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:9px;
}

.activity-mobile-row{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.activity-mobile-label{
  color:#7b8799;
  font-size:10px;
  font-weight:750;
  letter-spacing:.05em;
  text-transform:uppercase;
}

.activity-mobile-value{
  color:#28364c;
  font-size:12px;
  line-height:1.45;
  word-break:break-word;
}

@media(max-width:900px){
  .dashboard-stats{
    grid-template-columns:1fr;
  }

  .dashboard-hero{
    align-items:flex-start;
    flex-direction:column;
  }
}

@media(max-width:768px){
  .dashboard-shell{
    gap:15px;
  }

  .dashboard-hero,
  .activity-card{
    padding:16px;
    border-radius:20px;
  }

  .dashboard-hero h1{
    font-size:25px;
  }

  .activity-card-header{
    align-items:stretch;
    flex-direction:column;
  }

  .activity-controls,
  .activity-search{
    width:100%;
  }

  .activity-table-wrap{
    display:none;
  }

  .activity-mobile-list{
    display:flex;
  }

  .stat-value{
    font-size:38px;
  }
}
</style>

<div class="dashboard-shell">
  </section>

  <section class="dashboard-stats">

    <article class="stat-card docs clickable" data-dash-status="ALL">
      <div class="stat-content">
        <div class="stat-top">
          <span class="stat-icon">
            <i class="fas fa-folder-open"></i>
          </span>

          <span class="stat-chip">Docs</span>
        </div>

        <div class="stat-label">Total Documents</div>
        <div class="stat-value" id="dashTotalDocuments">0</div>
        <div class="stat-subtext">All encoded records in the tracking system</div>
      </div>
    </article>

    <article class="stat-card pending clickable" data-dash-status="PENDING">
      <div class="stat-content">
        <div class="stat-top">
          <span class="stat-icon">
            <i class="fas fa-clock"></i>
          </span>

          <span class="stat-chip">Pending</span>
        </div>

        <div class="stat-label">Total Pending</div>
        <div class="stat-value" id="dashPendingDocuments">0</div>
        <div class="stat-subtext">Documents still moving through the workflow</div>
      </div>
    </article>

    <article class="stat-card approved clickable" data-dash-status="APPROVED">
      <div class="stat-content">
        <div class="stat-top">
          <span class="stat-icon">
            <i class="fas fa-circle-check"></i>
          </span>

          <span class="stat-chip">Approved</span>
        </div>

        <div class="stat-label">Total Approved</div>
        <div class="stat-value" id="dashApprovedDocuments">0</div>
        <div class="stat-subtext">Completed and approved document records</div>
      </div>
    </article>

  </section>

  <section class="activity-card">

    <div class="activity-card-header">

      <div class="activity-heading">
        <span class="activity-icon">
          <i class="fas fa-wave-square"></i>
        </span>

        <div>
          <h3 id="dashActivityTitle">Recent Document Activity</h3>
          <div class="activity-subtitle" id="dashActivitySubtitle">
            Latest updates from the tracking system
          </div>
        </div>
      </div>

      <div class="activity-controls">
        <label class="activity-search">
          <i class="fas fa-magnifying-glass"></i>
          <input
            id="dashActivitySearch"
            type="search"
            placeholder="Search displayed records..."
            autocomplete="off"
          >
        </label>
      </div>

    </div>

    <div id="recentActivityContainer">
      <div class="loading-state">Loading dashboard data...</div>
    </div>

  </section>

</div>

<script>
let dashRecentActivityRecords = [];
let dashDisplayedRecords = [];
let dashCurrentStatus = 'RECENT';

function dashEsc(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function dashSafe(value,fallback='—'){
  const text = String(value ?? '').trim();
  return text || fallback;
}

function dashStatusClass(status){
  if(status === 'Approved') return 'chip-approved';
  if(status === 'Return to Sender') return 'chip-rts';
  return 'chip-pending';
}

function dashEffectiveStatus(record){
  const approvalState = String(record.approvalState || '').trim().toLowerCase();
  const latestRoutingCheckpoint = String(record.latestRoutingCheckpoint || '').trim().toLowerCase();

  if(
    approvalState === 'approved' ||
    latestRoutingCheckpoint === 'completed/approved'
  ){
    return 'Approved';
  }

  if(approvalState === 'return to sender'){
    return 'Return to Sender';
  }

  return 'Pending';
}

function dashSearchableText(record){
  return [
    record.activityType,
    record.referenceNumber,
    record.programUnit,
    record.documentType,
    record.documentDescription,
    record.currentStatus,
    record.approvalState,
    record.latestRoutingCheckpoint,
    record.activityDate
  ].join(' ').toLowerCase();
}

function dashSetActiveCard(status){
  document.querySelectorAll('[data-dash-status]').forEach(function(card){
    card.classList.toggle(
      'active-filter',
      String(card.dataset.dashStatus || '') === String(status || '')
    );
  });
}

function renderRecentActivity(records){
  const container = document.getElementById('recentActivityContainer');

  if(!Array.isArray(records) || !records.length){
    container.innerHTML = '<div class="empty-state">No records found.</div>';
    return;
  }

  let desktop = `
    <div class="activity-table-wrap">
      <table class="activity-table">
        <thead>
          <tr>
            <th>Activity</th>
            <th>Reference Number</th>
            <th>Program/Unit</th>
            <th>Document Type</th>
            <th>Description</th>
            <th>Current Status</th>
            <th>Approval</th>
            <th>Date/Time</th>
          </tr>
        </thead>
        <tbody>
  `;

  let mobile = '<div class="activity-mobile-list">';

  records.forEach(function(record){
    const effectiveStatus = dashEffectiveStatus(record);

    desktop += `
      <tr>
        <td>
          <span class="chip chip-blue">
            ${dashEsc(dashSafe(record.activityType,'Activity'))}
          </span>
        </td>

        <td>${dashEsc(dashSafe(record.referenceNumber))}</td>

        <td>
          <span class="program-pill">
            ${dashEsc(dashSafe(record.programUnit))}
          </span>
        </td>

        <td>${dashEsc(dashSafe(record.documentType))}</td>
        <td>${dashEsc(dashSafe(record.documentDescription))}</td>
        <td>${dashEsc(dashSafe(record.currentStatus))}</td>

        <td>
          <span class="chip ${dashStatusClass(effectiveStatus)}">
            ${dashEsc(effectiveStatus)}
          </span>
        </td>

        <td>${dashEsc(dashSafe(record.activityDate))}</td>
      </tr>
    `;

    mobile += `
      <article class="activity-mobile-item">

        <div class="activity-mobile-top">
          <div class="activity-mobile-ref">
            ${dashEsc(dashSafe(record.referenceNumber))}
          </div>

          <span class="chip chip-blue">
            ${dashEsc(dashSafe(record.activityType,'Activity'))}
          </span>
        </div>

        <div class="activity-mobile-grid">

          <div class="activity-mobile-row">
            <span class="activity-mobile-label">Program/Unit</span>
            <span class="activity-mobile-value">
              <span class="program-pill">
                ${dashEsc(dashSafe(record.programUnit))}
              </span>
            </span>
          </div>

          <div class="activity-mobile-row">
            <span class="activity-mobile-label">Document Type</span>
            <span class="activity-mobile-value">
              ${dashEsc(dashSafe(record.documentType))}
            </span>
          </div>

          <div class="activity-mobile-row">
            <span class="activity-mobile-label">Description</span>
            <span class="activity-mobile-value">
              ${dashEsc(dashSafe(record.documentDescription))}
            </span>
          </div>

          <div class="activity-mobile-row">
            <span class="activity-mobile-label">Current Status</span>
            <span class="activity-mobile-value">
              ${dashEsc(dashSafe(record.currentStatus))}
            </span>
          </div>

          <div class="activity-mobile-row">
            <span class="activity-mobile-label">Approval</span>
            <span class="activity-mobile-value">
              <span class="chip ${dashStatusClass(effectiveStatus)}">
                ${dashEsc(effectiveStatus)}
              </span>
            </span>
          </div>

          <div class="activity-mobile-row">
            <span class="activity-mobile-label">Date/Time</span>
            <span class="activity-mobile-value">
              ${dashEsc(dashSafe(record.activityDate))}
            </span>
          </div>

        </div>

      </article>
    `;
  });

  desktop += '</tbody></table></div>';
  mobile += '</div>';

  container.innerHTML = desktop + mobile;
}

function dashApplySearch(){
  const input = document.getElementById('dashActivitySearch');
  const query = String(input?.value || '').trim().toLowerCase();

  if(!query){
    renderRecentActivity(dashDisplayedRecords);
    return;
  }

  const filtered = dashDisplayedRecords.filter(function(record){
    return dashSearchableText(record).includes(query);
  });

  renderRecentActivity(filtered);
}

function renderDashboard(data){
  document.getElementById('dashTotalDocuments').textContent =
    Number(data.totalDocuments || 0);

  document.getElementById('dashPendingDocuments').textContent =
    Number(data.pendingDocuments || 0);

  document.getElementById('dashApprovedDocuments').textContent =
    Number(data.approvedDocuments || 0);

  dashRecentActivityRecords = Array.isArray(data.recentActivity)
    ? data.recentActivity
    : [];

  dashDisplayedRecords = [...dashRecentActivityRecords];
  dashCurrentStatus = 'RECENT';

  document.getElementById('dashActivityTitle').textContent =
    'Recent Document Activity';

  document.getElementById('dashActivitySubtitle').textContent =
    'Latest updates from the tracking system';

  document.getElementById('dashActivitySearch').value = '';

  dashSetActiveCard('');

  renderRecentActivity(dashDisplayedRecords);
}

function dashLoadStatusList(status){
  const titles = {
    ALL:[
      'All Documents',
      'All encoded records in the tracking system'
    ],
    PENDING:[
      'Pending Documents',
      'All records waiting for completion'
    ],
    APPROVED:[
      'Approved Documents',
      'All completed and approved records'
    ]
  };

  const title = titles[status] || titles.ALL;

  dashCurrentStatus = status;

  document.getElementById('dashActivityTitle').textContent = title[0];
  document.getElementById('dashActivitySubtitle').textContent = title[1];

  document.getElementById('dashActivitySearch').value = '';

  dashSetActiveCard(status);

  document.getElementById('recentActivityContainer').innerHTML =
    '<div class="loading-state">Loading records...</div>';

  google.script.run
    .withSuccessHandler(function(records){
      dashDisplayedRecords = Array.isArray(records) ? records : [];
      renderRecentActivity(dashDisplayedRecords);
    })
    .withFailureHandler(function(err){
      document.getElementById('recentActivityContainer').innerHTML = `
        <div class="empty-state">
          ${dashEsc(
            err && err.message
              ? err.message
              : 'Failed to load records.'
          )}
        </div>
      `;
    })
    .dashGetDashboardRecordsByStatus(status);
}

document.addEventListener('DOMContentLoaded',function(){

  document.querySelectorAll('[data-dash-status]').forEach(function(card){
    card.addEventListener('click',function(){
      dashLoadStatusList(this.dataset.dashStatus || 'ALL');
    });
  });

  const search = document.getElementById('dashActivitySearch');

  if(search){
    search.addEventListener('input',dashApplySearch);
  }

  google.script.run
    .withSuccessHandler(renderDashboard)
    .withFailureHandler(function(err){
      document.getElementById('recentActivityContainer').innerHTML = `
        <div class="empty-state">
          ${dashEsc(
            err && err.message
              ? err.message
              : 'Failed to load dashboard.'
          )}
        </div>
      `;
    })
    .dashGetDashboardData();

});
</script>
